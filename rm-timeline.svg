<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 978 352" width="978" height="352" role="img" aria-label="Timeline: the lender gives about 30 days, with extensions up to six months when the family shows a sale or loan in progress. In a full probate without a trust, the first hearing to appoint an executor comes 15 to 30 days after filing, so the first 30 days can pass before anyone can list the house"><title>Timeline: the lender gives about 30 days, with extensions up to six months when the family shows a sale or loan in progress. In a full probate without a trust, the first hearing to appoint an executor comes 15 to 30 days after filing, so the first 30 days can pass before anyone can list the house</title><rect width="978" height="352" fill="#fff"/><text x="24" y="40" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#222223" text-anchor="start">The lender&#x27;s clock vs. probate</text><text x="24" y="66" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5E5E60" text-anchor="start">Without a trust, the first probate hearing can land near the end of the first 30 days</text><text x="60" y="116" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#222223" text-anchor="start">Lender (HUD and CFPB)</text><rect x="60.0" y="130" width="138.0" height="34" fill="#222223"/><text x="129.0" y="152" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffea27" text-anchor="middle">30 days</text><rect x="198.0" y="130" width="689.9999999999999" height="34" fill="#ffea27" stroke="#222223"/><text x="543.0" y="152" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#222223" text-anchor="middle">Extensions with proof of a sale or loan, up to 6 months (CFPB)</text><text x="60" y="236" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#222223" text-anchor="start">Full probate (no trust)</text><rect x="60.0" y="250" width="138.0" height="34" fill="#F0F0F0" stroke="#5E5E60"/><rect x="129.0" y="250" width="69.0" height="34" fill="#5E5E60"/><text x="129.0" y="306" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#222223" text-anchor="start">First hearing 15 to 30 days after filing</text><rect x="198.0" y="250" width="689.9999999999999" height="34" fill="#F0F0F0"/><text x="543.0" y="272" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#222223" text-anchor="middle">Once the executor is appointed, the house can be listed</text><line x1="60.0" y1="170" x2="60.0" y2="226" stroke="#ccc" stroke-dasharray="3 3"/><text x="60.0" y="188" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5E5E60" text-anchor="middle">Day 0</text><line x1="198.0" y1="170" x2="198.0" y2="226" stroke="#ccc" stroke-dasharray="3 3"/><text x="198.0" y="188" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5E5E60" text-anchor="middle">30</text><line x1="473.99999999999994" y1="170" x2="473.99999999999994" y2="226" stroke="#ccc" stroke-dasharray="3 3"/><text x="473.99999999999994" y="188" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5E5E60" text-anchor="middle">90</text><line x1="887.9999999999999" y1="170" x2="887.9999999999999" y2="226" stroke="#ccc" stroke-dasharray="3 3"/><text x="887.9999999999999" y="188" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#5E5E60" text-anchor="middle">180 days</text><text x="24" y="334" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5E60" text-anchor="start">Sources: HUD; CFPB; Probate Code 8003. Timelines are minimums or allowances, not promises. Your attorney and servicer confirm dates.</text></svg>