<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 978 374" width="978" height="374" role="img" aria-label="Flow chart: when a parent with a reverse mortgage dies, the loan comes due. The family can keep the house by paying the full balance, sell it and repay the loan, selling for at least 95 percent of appraised value if the loan is more than the house is worth, or sign it over with a deed in lieu of foreclosure"><title>Flow chart: when a parent with a reverse mortgage dies, the loan comes due. The family can keep the house by paying the full balance, sell it and repay the loan, selling for at least 95 percent of appraised value if the loan is more than the house is worth, or sign it over with a deed in lieu of foreclosure</title><rect width="978" height="374" fill="#fff"/><text x="24" y="40" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#222223" text-anchor="start">A parent with a reverse mortgage dies. What now?</text><rect x="339" y="64" width="300" height="56" rx="12" fill="#222223"/><text x="489" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffea27" text-anchor="middle">The loan comes due</text><text x="489" y="142" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#222223" text-anchor="middle">Call the servicer in the first 30 days</text><line x1="489" y1="152" x2="174" y2="176" stroke="#5E5E60" stroke-width="2"/><rect x="24" y="176" width="300" height="150" rx="12" fill="#F0F0F0"/><text x="174" y="212" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#222223" text-anchor="middle">Keep the house</text><text x="174" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">Pay the full loan</text><text x="174" y="270" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">balance, often with</text><text x="174" y="294" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">a new loan</text><line x1="489" y1="152" x2="489" y2="176" stroke="#5E5E60" stroke-width="2"/><rect x="339" y="176" width="300" height="150" rx="12" fill="#F0F0F0"/><text x="489" y="212" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#222223" text-anchor="middle">Sell the house</text><text x="489" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">Repay the loan.</text><text x="489" y="270" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">Worth less than the loan?</text><text x="489" y="294" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">Sell for 95% or more</text><line x1="489" y1="152" x2="804" y2="176" stroke="#5E5E60" stroke-width="2"/><rect x="654" y="176" width="300" height="150" rx="12" fill="#F0F0F0"/><text x="804" y="212" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#222223" text-anchor="middle">Sign it over</text><text x="804" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">Deed in lieu of</text><text x="804" y="270" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">foreclosure. Walk away</text><text x="804" y="294" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#222223" text-anchor="middle">from house and loan</text><text x="24" y="356" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5E5E60" text-anchor="start">Source: HUD, Inheriting a Home Secured by an FHA-insured HECM; CFPB. Rules shown are for FHA-insured HECM loans.</text></svg>